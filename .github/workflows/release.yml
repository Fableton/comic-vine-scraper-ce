name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .crplugin
        shell: pwsh
        run: .\build.ps1

      - name: Find built plugin
        id: plugin
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path build -Filter *.crplugin | Select-Object -First 1
          echo "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($file.Name)" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.plugin.outputs.path }}
          generate_release_notes: true
